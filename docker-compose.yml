services:
  download-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: download-bot

    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env or environment}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?Set SPOTIFY_CLIENT_ID in .env or environment}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?Set SPOTIFY_CLIENT_SECRET in .env or environment}
      MEDIA_PROXY: ${MEDIA_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-5}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-49}
      INLINE_CACHE_CHAT_ID: ${INLINE_CACHE_CHAT_ID:-}
      COOKIES_FILE: ${COOKIES_FILE:-}

    volumes:
      - "./data:/app/data"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
